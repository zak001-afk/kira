<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIRA — 3D Neural Interface</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  </head>
  <body>
    <!-- 3D Canvas -->
    <canvas id="scene"></canvas>

    <!-- HUD Overlay -->
    <div id="hud">
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="logo-section">
          <div class="logo-hex">
            <svg viewBox="0 0 100 100" class="hex-bg">
              <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" />
            </svg>
            <span class="logo-text">K</span>
          </div>
          <div class="logo-info">
            <h1>KIRA</h1>
            <span class="version">v8.1 Neural Core</span>
          </div>
        </div>

        <div class="status-section">
          <div class="status-badge online">
            <div class="status-dot"></div>
            <span>ONLINE</span>
          </div>
          <div class="time-display">
            <div class="time" id="time">00:00:00</div>
            <div class="date" id="date">Loading...</div>
          </div>
        </div>
      </div>

      <!-- Left Panel: Conversation -->
      <div class="panel left-panel">
        <div class="panel-header">
          <div class="panel-icon">💬</div>
          <h2>NEURAL LINK</h2>
          <button class="clear-btn" id="clear-chat" title="Clear">✕</button>
        </div>
        <div class="conversation" id="conversation">
          <div class="message-block">
            <div class="message-meta">
              <span class="sender kira">KIRA</span>
              <span class="timestamp" id="boot-time"></span>
            </div>
            <div class="message">Good day, sir. All systems operational.</div>
          </div>
        </div>
      </div>

      <!-- Right Panel: System -->
      <div class="panel right-panel">
        <div class="panel-header">
          <div class="panel-icon">⚡</div>
          <h2>SYSTEMS</h2>
        </div>
        <div class="system-content">
          <div class="metric-group">
            <h3>PERFORMANCE</h3>
            <div class="metric">
              <div class="metric-label">
                <span>CPU</span>
                <span class="metric-value" id="cpu">0%</span>
              </div>
              <div class="metric-bar">
                <div class="metric-fill" id="cpu-bar"></div>
              </div>
            </div>
            <div class="metric">
              <div class="metric-label">
                <span>MEMORY</span>
                <span class="metric-value" id="memory">0%</span>
              </div>
              <div class="metric-bar">
                <div class="metric-fill" id="memory-bar"></div>
              </div>
            </div>
            <div class="metric">
              <div class="metric-label">
                <span>GPU</span>
                <span class="metric-value" id="gpu">N/A</span>
              </div>
            </div>
          </div>

          <div class="metric-group">
            <h3>QUICK ACCESS</h3>
            <div class="quick-grid">
              <button class="quick-btn" onclick="quickCmd('open chrome')">
                <span class="icon">🌐</span>
                <span>Browser</span>
              </button>
              <button class="quick-btn" onclick="quickCmd('search for')">
                <span class="icon">🔍</span>
                <span>Search</span>
              </button>
              <button class="quick-btn" onclick="quickCmd('learn about')">
                <span class="icon">📚</span>
                <span>Learn</span>
              </button>
              <button class="quick-btn" onclick="quickCmd('list tasks')">
                <span class="icon">✓</span>
                <span>Tasks</span>
              </button>
            </div>
          </div>

          <div class="metric-group">
            <h3>ACTIVE TASKS</h3>
            <div class="tasks-list" id="tasks-list">
              <div class="task-empty">No pending tasks</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom: Command Input -->
      <div class="command-section">
        <div class="command-container">
          <button class="cmd-btn mic-btn" id="mic" title="Voice Input">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
          
          <div class="input-wrapper">
            <input
              id="command"
              type="text"
              placeholder="Command KIRA..."
              autocomplete="off"
            />
            <div class="input-glow"></div>
          </div>
          
          <button class="cmd-btn mute-btn" id="mute" title="Toggle Voice">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </button>
          
          <button class="cmd-btn send-btn" id="send" title="Execute">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </button>
        </div>
        
        <div class="activity-bar">
          <div class="activity-indicator" id="activity-indicator">
            <div class="indicator-dot"></div>
            <span id="activity">STANDBY</span>
          </div>
        </div>
      </div>
    </div>

    <script src="./scene.js"></script>
    <script src="./app.js"></script>
  </body>
</html>

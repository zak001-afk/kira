name: Holographic UI and speech

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  speech:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check ui/app.js
          node --check ui/speech.mjs
          node --check ui/hologram.mjs
      - name: Test speech lifecycle and holographic field integration
        run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test local assets and same-origin API proxy
        run: python -m unittest discover -s tests -p 'test_*.py'

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test tools
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test cockpit layouts and controls (no desktop actions)
        run: python tests/cockpit_browser.py
